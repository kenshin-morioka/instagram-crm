# website/ の変更をGitHub Pagesへデプロイする
# (Pagesのソースは「GitHub Actions」方式に設定済み)
name: Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - uses: actions/deploy-pages@v5
        id: deployment
