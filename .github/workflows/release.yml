# vX.Y.Z タグのpushで macOS / Windows のインストーラーをビルドし、
# GitHub Release と自動アップデート用の latest.json を公開する
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOSはApple Silicon / Intel両方のバイナリを作る
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # フロントエンドは静的ファイル (ui/) のみでnpmビルド不要のため、CLIだけ入れる
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # アップデーター署名鍵 (リポジトリのSecretsに登録しておく)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Instagram CRM ${{ github.ref_name }}"
          releaseBody: "詳細は下記のAssetsからOSに合ったファイルをダウンロードしてください。macOS: .dmg / Windows: .msi"
          releaseDraft: false
          args: ${{ matrix.args }}
